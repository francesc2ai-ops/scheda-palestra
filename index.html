<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scheda Palestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f8; --card:#ffffff; --ink:#14202e; --muted:#6a7787;
    --line:#d9e0e8; --accent:#1d5fa8; --accent-ink:#ffffff; --head:#dbe8f6;
    --cell:#f8fafc; --na:#eef1f4; --ok:#1f8a4c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1420; --card:#151f2e; --ink:#e8eef5; --muted:#8d9bab;
      --line:#2a3748; --accent:#4b8fe0; --accent-ink:#0d1420; --head:#1d2c41;
      --cell:#101a27; --na:#1a2433; --ok:#3fbf73;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
  h1,h2,.day-btn,.ex-name,.prog-btn{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* LOGIN */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .login-box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
  .login-box h1{margin:0 0 4px;font-size:34px;text-transform:uppercase}
  .login-box p{margin:0 0 20px;color:var(--muted)}
  .login-box input{width:100%;padding:14px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--cell);color:var(--ink)}
  .login-box button[type=submit]{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
  .known{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .known-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 14px;background:var(--cell);border-bottom:1px solid var(--line)}
  .known-name{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;text-align:left}
  .known-name:last-child{border-bottom:0}
  .known-name::after{content:"›";color:var(--muted);font-size:20px;line-height:1}
  .known-name:active{background:var(--cell)}

  /* HEADER */
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:900px;margin:0 auto}
  .who{min-width:0}
  #hello{display:block;font-family:"Barlow Condensed",Inter,sans-serif;font-size:22px;font-weight:700;line-height:1.1}
  #motto{display:block;color:var(--accent);font-size:13px;font-weight:500;margin-top:2px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
  .back{border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:600;padding:6px 0;margin:8px auto 0;display:block;max-width:900px;width:100%;text-align:left}
  .days{display:flex;gap:8px;max-width:900px;margin:6px auto 0}
  .day-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--cell);color:var(--ink);font-size:20px;font-weight:700;text-transform:uppercase}
  .day-btn small{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .day-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .day-btn.active small{color:var(--accent-ink);opacity:.8}

  /* SCHEDE */
  main{max-width:900px;margin:0 auto;padding:16px 16px 60px}
  .home-title{font-family:"Barlow Condensed",Inter,sans-serif;font-size:26px;text-transform:uppercase;margin:6px 0 14px}
  .progs{display:grid;gap:12px}
  .prog-btn{display:block;width:100%;text-align:left;padding:22px 20px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;text-transform:uppercase}
  .prog-btn small{display:block;font-family:Inter,sans-serif;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;opacity:.85;margin-top:4px}

  .ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .ex-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
  .ex-name{font-size:22px;font-weight:700;text-transform:uppercase;margin:0;line-height:1.1}
  .ex-note{margin-top:4px;font-size:13px;color:var(--muted)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:560px}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0}
  tr:last-child td{border-bottom:0}
  th:last-child,td:last-child{border-right:0}
  thead th{background:var(--head);font-size:12px;font-weight:600;padding:6px 0}
  tbody th{position:sticky;left:0;background:var(--card);font-size:12px;font-weight:600;color:var(--muted);width:56px;text-align:left;padding-left:10px;z-index:1}
  thead th:first-child{position:sticky;left:0;z-index:2}
  td input{width:100%;min-width:52px;border:0;background:var(--cell);color:var(--ink);text-align:center;padding:11px 2px;font-size:15px;font-family:inherit}
  td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--card)}
  td.fixed{font-weight:600;padding:11px 2px;font-size:15px}
  td.na{background:var(--na);color:var(--muted);font-size:13px}

  #saved{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
  #saved.show{opacity:1}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>

<section id="login">
  <div class="login-box">
    <h1>Scheda Palestra</h1>
    <p>Scrivi il tuo nome per aprire la tua scheda.</p>
    <form id="loginForm">
      <input id="nameInput" type="text" placeholder="Il tuo nome" autocomplete="off" autocapitalize="words" required>
      <button type="submit">Entra</button>
    </form>
    <div class="known hidden" id="known"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="top">
      <div class="who"><span id="hello"></span><small id="motto"></small></div>
      <button class="ghost" id="logoutBtn">Esci</button>
    </div>
    <div id="sheetNav" class="hidden">
      <button class="back" id="backBtn">‹ Tutte le schede</button>
      <div class="days" id="days"></div>
    </div>
  </header>
  <main id="home" class="hidden">
    <h2 class="home-title">Le tue schede</h2>
    <div class="progs" id="progs"></div>
  </main>
  <main id="sheet" class="hidden"></main>
</section>

<div id="saved">Salvato</div>

<script src="firebase-config.js"></script>
<script>
/* ===== SCHEDE =====
   Per aggiungere una scheda: copia un blocco di PROGRAMMI e cambia id, titolo e
   prefisso (il prefisso tiene separati i dati di ogni scheda; non cambiarlo dopo).
   rip: ripetizioni prestampate per S1..S8 (fisse)
   noPeso / noRpe: settimane con "/" (ALL = tutte, oppure indici 0..7) */
const ALL = true;
const R = s => s.split(' ');
const PROGRAMMI = [
  { id:"schede2", titolo:"Schede 2", sottotitolo:"Giorno 1 Forza · Giorno 2 Pliometrie", prefisso:"",
    giorni: [
      { nome:"Giorno 1", sotto:"Forza", esercizi: [
        { nome:"Squat esplosivi", note:"Seguo schema di lavoro (negativa lenta, salita forte)", rip:R("3X4 3X4 3X5 3X5 3X6 3X6 3X6 3X6") },
        { nome:"RDL / Leg curl", note:"3 serie da 8 ripetizioni" },
        { nome:"Hip trust monopodalico", note:"3 serie da 6 ripetizioni x gamba" },
        { nome:"Chin up + push up", note:"3 serie da 8 + 8 ripetizioni", noPeso:ALL, noRpe:ALL },
        { nome:"Push up su rialzi alternato", note:"Seguo schema di lavoro", rip:R("2X8 2X10 3X8 3X8 3X10 3X10 3X12 3X12"), noPeso:ALL, noRpe:ALL },
        { nome:"Alzate laterali", note:"3 serie da 10 ripetizioni + 5'' isometria finale" },
        { nome:"Calf raise monopodalici", note:"2 serie da 10 ripetizioni x gamba" },
      ]},
      { nome:"Giorno 2", sotto:"Pliometrie", esercizi: [
        { nome:"Seated box jump", note:"Seguire schema di lavoro (altezza box 60)", rip:R("3x3 3x3 3x4 3x4 3x3 3x3 3x5 3x5"), noPeso:[4,5,6,7], noRpe:[4,5,6,7] },
        { nome:"Trap bar + jump", note:"Seguo schema di lavoro (negativa lenta con peso)", rip:R("3x3 3x3 3x4 3x4 3x5 3x5 3x6 3x6") },
        { nome:"Lateral bound + step jump", note:"Seguo schema di lavoro", rip:R("3x5 3x5 3x6 3x6 4x3 4x3 4x4 4x4"), noPeso:ALL, noRpe:ALL },
        { nome:"Knee jump + vertical", note:"Seguo schema di lavoro", rip:R("3x2 3x2 3x3 3x3 2x4 2x3 2x2 3x2"), noPeso:ALL, noRpe:ALL },
        { nome:"Bulgarian jump + step", note:"Seguo schema di lavoro", rip:R("3x5 3x5 3x6 3x6 4x3 4x3 4x4 4x4"), noPeso:ALL, noRpe:ALL },
        { nome:"Landmine OH press", note:"3 serie da 5 ripetizioni x lato (esecuzione in ginocchio)" },
        { nome:"Kneeling trunk rotation", note:"3 serie da 4 ripetizioni x lato" },
      ]},
    ]},
];
const SETTIMANE = 8;
const RIGHE = [["rip","RIP"],["peso","PESO"],["rpe","RPE"]];
const ULTIMA = "_ultima";   // chiave in "dati" con l'ultima scheda/giorno aperti
const FRASI = [
  "Buon allenamento!",
  "Oggi si salta più in alto 🏐",
  "Ogni serie conta.",
  "Testa, cuore e gambe!",
  "Una rep alla volta.",
  "La costanza batte il talento.",
  "Spingi forte, atterra morbido.",
  "Allenati come giochi, gioca come ti alleni.",
  "Muro alto, testa alta!",
  "Piccoli progressi, grandi risultati.",
  "Oggi meglio di ieri.",
  "Forza, si vola! 💪",
];

/* ===== STORAGE =====
   Copia locale sempre attiva (funziona anche senza rete).
   Se firebase-config.js contiene la configurazione, i dati vengono
   sincronizzati su Firestore e si ritrovano da qualsiasi dispositivo. */
const KEY = "schedaPalestra.v1";
function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {users:{}} }catch(e){ return {users:{}} } }
function saveAll(db){ try{ localStorage.setItem(KEY, JSON.stringify(db)); return true }catch(e){ return false } }
const idOf = n => n.trim().toLowerCase().replace(/\s+/g," ");

let db = loadAll(), userId = null, prog = null, day = 0;

const cloud = { ready:null, fs:null, api:null };
if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId) {
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  cloud.ready = Promise.all([import(V+"firebase-app.js"), import(V+"firebase-firestore.js")])
    .then(([app, fs])=>{
      const a = app.initializeApp(window.FIREBASE_CONFIG);
      try { cloud.fs = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
      catch(e){ cloud.fs = fs.getFirestore(a); }
      cloud.api = fs; return true;
    })
    .catch(e=>{ console.warn("Firebase non disponibile", e); return false; });
}
const docRef = id => cloud.api.doc(cloud.fs, "utenti", id.replace(/\//g,"_"));

// Non blocca mai l'accesso: se la rete è lenta entra con i dati del telefono
// e aggiorna la scheda quando arrivano quelli online.
const ATTESA_MAX = 3000;
const entro = (p, ms) => Promise.race([p, new Promise(r=>setTimeout(()=>r("timeout"), ms))]);
function mergeRemote(id, snap, localeVince){
  if(!snap || !snap.exists()) return false;
  const r = snap.data();
  const u = db.users[id] || (db.users[id] = {nome:r.nome||id, dati:{}});
  u.dati = localeVince ? Object.assign({}, r.dati||{}, u.dati) : Object.assign({}, u.dati, r.dati||{});
  saveAll(db);
  return true;
}
async function pullUser(id){
  if(!cloud.ready) return;
  try{
    const ok = await entro(cloud.ready, ATTESA_MAX);
    if(ok !== true) return;
    const p = cloud.api.getDoc(docRef(id));
    const snap = await entro(p, ATTESA_MAX);
    if(snap !== "timeout"){ mergeRemote(id, snap); return; }
    // arrivano dopo: aggiorna la scheda se l'utente è ancora lo stesso
    // (i valori scritti nel frattempo sul telefono hanno la precedenza)
    p.then(s=>{ if(mergeRemote(id, s, true) && userId===id && prog) render(); }).catch(()=>{});
  }catch(e){ console.warn("Lettura online fallita", e); }
}
let pushTimer;
function pushUser(silent){
  if(!cloud.ready) return;
  clearTimeout(pushTimer);
  const id = userId, u = userData();
  pushTimer = setTimeout(async ()=>{
    if(!(await cloud.ready)) return;
    try{
      await cloud.api.setDoc(docRef(id), { nome:u.nome, dati:u.dati, aggiornato: cloud.api.serverTimestamp() }, { merge:true });
      if(!silent) toast("Salvato online");
    }catch(e){ console.warn("Salvataggio online fallito", e); if(!silent) toast("Salvato sul telefono"); }
  }, 700);
}

function userData(){
  if(!db.users[userId]) db.users[userId] = { nome:"", dati:{} };
  return db.users[userId];
}
const cellKey = (d,e,r,s) => `${prog.prefisso}${d}.${e}.${r}.${s}`;

/* ===== SCHERMATE ===== */
function show(screen){
  document.getElementById("login").classList.toggle("hidden", screen!=="login");
  document.getElementById("app").classList.toggle("hidden", screen==="login");
  document.getElementById("home").classList.toggle("hidden", screen!=="home");
  document.getElementById("sheet").classList.toggle("hidden", screen!=="sheet");
  document.getElementById("sheetNav").classList.toggle("hidden", screen!=="sheet");
  window.scrollTo({top:0});
}

/* ===== LOGIN ===== */
function renderKnown(){
  const box = document.getElementById("known");
  const names = Object.values(db.users).map(u=>u.nome).filter(Boolean)
    .sort((a,b)=>a.localeCompare(b,"it"));
  box.innerHTML = "";
  box.classList.toggle("hidden", !names.length);
  if(!names.length) return;
  box.insertAdjacentHTML("beforeend", `<div class="known-title">Nomi già usati</div>`);
  names.forEach(n=>{
    const b = document.createElement("button");
    b.className="known-name"; b.type="button"; b.textContent=n;
    b.onclick=()=>login(n);
    box.appendChild(b);
  });
}
async function login(nome){
  nome = nome.trim(); if(!nome) return;
  const id = idOf(nome);
  const btn = document.querySelector("#loginForm button");
  btn.disabled = true; btn.textContent = "Carico…";
  await pullUser(id);
  btn.disabled = false; btn.textContent = "Entra";
  userId = id;
  const u = userData(); if(!u.nome) u.nome = nome;
  saveAll(db);
  try{ localStorage.setItem(KEY+".last", userId) }catch(e){}
  document.getElementById("hello").textContent = `Ciao ${u.nome}!`;
  document.getElementById("motto").textContent = FRASI[Math.floor(Math.random()*FRASI.length)];
  // riapre l'ultima scheda e l'ultimo giorno usati
  const [pid, d] = String(u.dati[ULTIMA]||"").split(":");
  const p = PROGRAMMI.find(x=>x.id===pid);
  if(p) openProg(p, +d||0); else showHome();
}
function logout(){
  userId = null; prog = null;
  try{ localStorage.removeItem(KEY+".last") }catch(e){}
  document.getElementById("nameInput").value = "";
  renderKnown();
  show("login");
}

/* ===== HOME ===== */
function showHome(){
  const box = document.getElementById("progs");
  box.innerHTML = "";
  PROGRAMMI.forEach(p=>{
    const b = document.createElement("button");
    b.className = "prog-btn";
    b.innerHTML = `${p.titolo}<small>${p.sottotitolo}</small>`;
    b.onclick = ()=>openProg(p, 0);
    box.appendChild(b);
  });
  show("home");
}

/* ===== SCHEDA ===== */
function openProg(p, d){
  prog = p;
  const days = document.getElementById("days");
  days.innerHTML = "";
  p.giorni.forEach((g,i)=>{
    const b = document.createElement("button");
    b.className = "day-btn"; b.dataset.day = i;
    b.innerHTML = `${g.nome}<small>${g.sotto||""}</small>`;
    b.onclick = ()=>setDay(i);
    days.appendChild(b);
  });
  show("sheet");
  setDay(Math.min(d, p.giorni.length-1));
}
function isNA(ex, riga, s){
  const v = riga==="peso" ? ex.noPeso : riga==="rpe" ? ex.noRpe : null;
  return v===true || (Array.isArray(v) && v.includes(s));
}
function setDay(d){
  day = d;
  document.querySelectorAll(".day-btn").forEach(b=>b.classList.toggle("active", +b.dataset.day===d));
  const u = userData(), pos = `${prog.id}:${d}`;
  if(u.dati[ULTIMA] !== pos){ u.dati[ULTIMA] = pos; saveAll(db); pushUser(true); }
  render();
  window.scrollTo({top:0});
}
function render(){
  const dati = userData().dati;
  const main = document.getElementById("sheet");
  main.innerHTML = "";
  prog.giorni[day].esercizi.forEach((ex, ei)=>{
    const card = document.createElement("article");
    card.className = "ex";
    let h = `<div class="ex-head"><h2 class="ex-name">${ex.nome}</h2><div class="ex-note">${ex.note}</div></div>`;
    h += `<div class="scroll"><table><thead><tr><th></th>`;
    for(let s=0;s<SETTIMANE;s++) h += `<th>S${s+1}</th>`;
    h += `</tr></thead><tbody>`;
    RIGHE.forEach(([r,label])=>{
      h += `<tr><th>${label}</th>`;
      for(let s=0;s<SETTIMANE;s++){
        if(isNA(ex,r,s)){ h += `<td class="na">/</td>`; continue; }
        const preset = r==="rip" && ex.rip ? ex.rip[s] : "";
        if(preset){ h += `<td class="fixed">${preset}</td>`; continue; }
        const k = cellKey(day,ei,r,s);
        const val = k in dati ? dati[k] : "";
        const mode = r==="rip" ? "text" : "decimal";
        h += `<td><input data-k="${k}" inputmode="${mode}" value="${String(val).replace(/"/g,"&quot;")}" aria-label="${ex.nome} ${label} S${s+1}"></td>`;
      }
      h += `</tr>`;
    });
    h += `</tbody></table></div>`;
    card.innerHTML = h;
    main.appendChild(card);
  });
  main.insertAdjacentHTML("beforeend", `<p class="foot">Scorri la tabella a destra per vedere tutte le settimane.</p>`);
}

let toastTimer;
function toast(msg="Salvato"){
  const t = document.getElementById("saved");
  t.textContent = msg;
  t.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1100);
}
document.getElementById("sheet").addEventListener("input", e=>{
  const k = e.target.dataset.k; if(!k) return;
  userData().dati[k] = e.target.value;
  saveAll(db);
  toast();
  if(cloud.ready) pushUser();
});

/* ===== AVVIO ===== */
document.getElementById("loginForm").onsubmit = e=>{ e.preventDefault(); login(document.getElementById("nameInput").value) };
document.getElementById("logoutBtn").onclick = logout;
document.getElementById("backBtn").onclick = showHome;
let last = null; try{ last = localStorage.getItem(KEY+".last") }catch(e){}
if(last && db.users[last]) login(db.users[last].nome); else { renderKnown(); show("login"); }
</script>
</body>
</html>
